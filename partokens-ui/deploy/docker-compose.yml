x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: ${PARTOKENS_UI_IMAGE:-partokens-ui:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PUBLIC_PARTOKENS_SOURCE_URL: ${PUBLIC_PARTOKENS_SOURCE_URL:-}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      new-api:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTP_HOST_PORT:-80}:80"
      - "${CADDY_HTTPS_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_HOST_PORT:-443}:443"
    environment:
      PARTOKENS_SITE_ADDRESS: ${PARTOKENS_SITE_ADDRESS:?Set PARTOKENS_SITE_ADDRESS to the public hostname}
      PARTOKENS_API_ORIGIN: ${PARTOKENS_API_ORIGIN:-http://new-api:${NEW_API_CONTAINER_PORT:-3000}}
      PARTOKENS_ROBOTS_HEADER: ${PARTOKENS_ROBOTS_HEADER:-all}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  new-api:
    image: ${NEW_API_IMAGE:-calciumion/new-api:v1.0.0-rc.21}
    restart: unless-stopped
    logging: *default-logging
    command: ["--log-dir", "/app/logs"]
    expose:
      - "${NEW_API_CONTAINER_PORT:-3000}"
    ports:
      - "${NEW_API_BIND_ADDRESS:-127.0.0.1}:${NEW_API_HOST_PORT:-3000}:${NEW_API_CONTAINER_PORT:-3000}"
    environment:
      PORT: ${NEW_API_CONTAINER_PORT:-3000}
      SQL_DSN: ${SQL_DSN:-postgresql://${POSTGRES_USER:-newapi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-new_api}}
      REDIS_CONN_STRING: ${REDIS_CONN_STRING:-redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379}
      TZ: ${TZ:-Asia/Shanghai}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      NODE_NAME: ${NEW_API_NODE_NAME:-new-api-node-1}
      SESSION_SECRET: ${SESSION_SECRET:?Set a long random SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:?Set the exact HTTPS public origin, for example https://partokens.com}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${EDGE_NETWORK_SUBNET:-172.30.0.0/24}}
    volumes:
      - new_api_data:/data
      - new_api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PORT:-3000}/api/status | grep -q '\"success\":\\s*true'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-new_api}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-newapi} -d $${POSTGRES_DB:-new_api}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  caddy_data:
  caddy_config:
  new_api_data:
  new_api_logs:
  postgres_data:
  redis_data:

networks:
  edge:
    name: ${COMPOSE_PROJECT_NAME:-partokens}_edge
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_NETWORK_SUBNET:-172.30.0.0/24}
  backend:
    name: ${COMPOSE_PROJECT_NAME:-partokens}_backend
    driver: bridge
    internal: true
