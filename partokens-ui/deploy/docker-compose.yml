services:
  web:
    image: ${PARTOKENS_UI_IMAGE:-partokens-ui:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PUBLIC_PARTOKENS_SOURCE_URL: ${PUBLIC_PARTOKENS_SOURCE_URL:?Set the public source URL pinned to PARTOKENS_SOURCE_COMMIT}
        PARTOKENS_SOURCE_COMMIT: ${PARTOKENS_SOURCE_COMMIT:?Set the full Git commit used for this build}
    restart: unless-stopped
    init: true
    ports:
      - "${PARTOKENS_HTTP_BIND_ADDRESS:-0.0.0.0}:${PARTOKENS_HTTP_PORT:-8080}:8080"
    environment:
      PARTOKENS_SITE_ADDRESS: ${PARTOKENS_SITE_ADDRESS:-http://:8080}
      PARTOKENS_API_ORIGIN: ${PARTOKENS_API_ORIGIN:?Set the existing API origin reachable from this container}
      PARTOKENS_ADMIN_API_ORIGIN: ${PARTOKENS_ADMIN_API_ORIGIN:?Set the external Partokens Admin API origin reachable from this container}
      PARTOKENS_ROBOTS_HEADER: ${PARTOKENS_ROBOTS_HEADER:-all}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
